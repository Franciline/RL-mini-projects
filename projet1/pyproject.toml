[project]
name = "tp-student-env"
version = "0.1.0"
requires-python = ">=3.11, <3.13"
dependencies = [
    "gymnasium",
    "ipywidgets",
    "jupyter",
    "jupyterlab",
    "matplotlib",
    "mazemdp",
    "numpy",
    "omegaconf",
    "optuna",
    "pyyaml",
    "rl-mind",
    "scipy",
    "torch",
    "tqdm",
    "ipykernel",
    "pandas",
]

[tool.uv]
package = false


[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["agents"]